name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [wpw-upstream-updated]

jobs:
  deploy-blog:
    name: Deploy blog (wezzard.com)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shared WPW middleware
        uses: actions/checkout@v4
        with:
          repository: WeZZard/gatsby-source-wpw
          token: ${{ secrets.GH_PAT }}
          path: gatsby-source-wpw

      - name: Checkout blog renderer
        uses: actions/checkout@v4
        with:
          repository: WeZZard/Gatsblog
          token: ${{ secrets.GH_PAT }}
          path: blog

      - name: Checkout MyWorks content
        uses: actions/checkout@v4
        with:
          path: MyWorks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build shared WPW middleware
        working-directory: gatsby-source-wpw
        run: |
          npm ci
          npm run build

      - name: Install and build blog
        working-directory: blog
        run: |
          npm ci
          npm run build

      - name: Deploy wezzard-blog to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: blog

  deploy-wmp:
    name: Deploy WMP (wmp.wezzard.com)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shared WPW middleware
        uses: actions/checkout@v4
        with:
          repository: WeZZard/gatsby-source-wpw
          token: ${{ secrets.GH_PAT }}
          path: gatsby-source-wpw

      - name: Checkout WMP renderer
        uses: actions/checkout@v4
        with:
          repository: WeZZard/gatsby-wpw-renderer-wmp
          token: ${{ secrets.GH_PAT }}
          path: wmp

      - name: Checkout MyWorks content
        uses: actions/checkout@v4
        with:
          path: MyWorks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build shared WPW middleware
        working-directory: gatsby-source-wpw
        run: |
          npm ci
          npm run build

      - name: Install and build WMP renderer (Direct Paste mode)
        working-directory: wmp
        run: |
          npm ci
          npm run build:paste

      - name: Deploy wezzard-wmp to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: wmp
